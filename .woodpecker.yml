when:
  event: [push]
  branch: [main]

labels:
  trust: deploy

steps:
  deploy:
    image: amazon/aws-cli
    environment:
      AWS_REGION: us-east-1
      INSTANCE_ID: i-0965c7b5c90528b64
    commands:
      - >
        aws ssm send-command
        --region $AWS_REGION
        --instance-ids $INSTANCE_ID
        --document-name AWS-RunShellScript
        --comment "Deploy landing-kaia ${CI_COMMIT_SHA}"
        --parameters commands='["bash /home/ubuntu/projects/Kaia/landing-kaia/infra/scripts/deploy-landing.sh"]'
        --output text --query Command.CommandId
